<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cucina La Magiostra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9a4a2a">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cucina">
<style>
:root{--t:#9a4a2a;--t2:#7c3a20;--tl:#f6e7dc;--bg:#f7f3ec;--card:#fff;--ink:#2a2420;--mut:#776c62;--b:#e6ddd0;--ok:#3f6b2f;--okl:#e4eedc;--w:#a86b00;--wl:#fbefd2;--r:#b3261e;--rl:#fbe6e3}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.app{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--t);color:#fff;position:sticky;top:0;z-index:20}
header.app h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
header.app h1 small{font-weight:400;opacity:.8}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;opacity:.82;padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:700}
#st{font-size:12px;opacity:.9;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#st.err{background:#fff;color:var(--r);padding:2px 8px;border-radius:6px;opacity:1}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:15px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:12px 14px;cursor:pointer}
.kpi b{display:block;font-size:26px;line-height:1.1;color:var(--t2)}
.kpi span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex1{flex:1}
.b{border:1px solid var(--b);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--t)}
.b.p{background:var(--t);border-color:var(--t);color:#fff}
.b.d{color:var(--r)}
.b.sm{padding:4px 9px;font-size:13px}
.b:disabled{opacity:.45;cursor:default}
input.i,select.i,textarea.i{border:1px solid var(--b);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea.i{min-height:120px;resize:vertical}
input.n{width:90px;text-align:right}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut);flex:1 1 180px}
label.f.s{flex:0 1 130px}
.list{max-height:calc(100vh - 230px);overflow:auto;border:1px solid var(--b);border-radius:10px;background:#fff}
.list .it{padding:9px 12px;border-bottom:1px solid var(--b);cursor:pointer;display:flex;gap:8px;align-items:center}
.list .it:hover{background:var(--tl)}
.list .it.on{background:var(--tl);border-left:4px solid var(--t)}
.list .it .nm{flex:1}
.list .it small{color:var(--mut);display:block;font-size:12px}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block}
.ok{background:var(--okl);color:var(--ok)}.w{background:var(--wl);color:var(--w)}.r{background:var(--rl);color:var(--r)}.g{background:#eee;color:#666}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--b);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#faf6f0;font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
table.t tr:hover td{background:#fdf9f4}
.scroll{overflow-x:auto}
.mut{color:var(--mut)}.small{font-size:12.5px}
.warn{background:var(--wl);border:1px solid #edd9a6;color:#6b4800;border-radius:8px;padding:8px 12px;margin:8px 0}
.err{background:var(--rl);border:1px solid #f1c3be;color:#7a1712;border-radius:8px;padding:8px 12px;margin:8px 0}
.good{background:var(--okl);border:1px solid #c8dcbb;color:#2b4d1f;border-radius:8px;padding:8px 12px;margin:8px 0}
.big{font-size:22px;font-weight:700;color:var(--t2)}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fc div{background:#faf6f0;border-radius:10px;padding:10px 12px}
.fc div span{display:block;font-size:12px;color:var(--mut)}
.fc div b{font-size:18px}
.drop{border:2px dashed var(--b);border-radius:12px;padding:26px;text-align:center;color:var(--mut);background:#fff}
.drop.on{border-color:var(--t);background:var(--tl)}
.proc{white-space:pre-wrap}
.al{font-weight:700}
#lock{position:fixed;inset:0;background:var(--t);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#lock .box{background:#fff;border-radius:16px;padding:26px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#lock h2{margin:0 0 6px;color:var(--t2)}
#lock .row{margin-top:12px}
#lock img{width:64px;height:64px;border-radius:14px;display:block;margin-bottom:10px}
.hidden{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:90vw}
#toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,20,10,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px}
dialog .dh h3{margin:0;flex:1}
dialog .db{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs2 button{border:1px solid var(--b);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.tabs2 button.on{background:var(--t);color:#fff;border-color:var(--t)}
#print{display:none}
@media (max-width:860px){
  header.app{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  nav{order:3;width:100%;margin-left:0}
  #st{max-width:60%}
  main{padding:10px}
  .split,.grid2{grid-template-columns:minmax(0,1fr)}
  .list{max-height:45vh}
  input.i,select.i,textarea.i{font-size:16px}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block!important;font:11pt/1.4 Arial,sans-serif;color:#000}
  #print h1{font-size:18pt;margin:0 0 4mm}
  #print h2{font-size:13pt;margin:6mm 0 2mm}
  #print table{border-collapse:collapse;width:100%;font-size:10pt}
  #print th,#print td{border-bottom:.3mm solid #999;padding:1.2mm 2mm;text-align:left;vertical-align:top}
  #print td.n,#print th.n{text-align:right}
  #print .pb{page-break-after:always}
  #print .head{display:flex;justify-content:space-between;border-bottom:.6mm solid #000;margin-bottom:4mm;padding-bottom:2mm}
}
</style>
</head>
<body>
<div id="lock"><div class="box" id="lockbox"></div></div>
<header class="app hidden" id="hdr">
  <h1>Cucina <small>· La Magiostra</small></h1>
  <span id="st"></span>
  <nav id="nav"></nav>
</header>
<main id="main" class="hidden"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<div id="print"></div>
<script src="lib/fflate.min.js"></script>
<script src="app.js"></script>
</body>
</html>
