# Controllo automatico: a ogni modifica fa girare i test (regole di legge, sicurezza, dati).
# Se compare una X rossa, la modifica ha rotto qualcosa: NON va pubblicata in produzione.
name: Test etichette
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sintassi
        run: for d in . prova; do [ -d "$d" ] && node --check $d/app.js && node --check $d/sw.js; done
      - name: Versione coerente nei tre punti
        run: |
          for d in . prova; do
            [ -d "$d" ] || continue
            V=$(node -p "require('./$d/version.json').version")
            grep -q "const APP_VERSION='$V'" $d/app.js || { echo "$d: APP_VERSION in app.js diversa da version.json ($V)"; exit 1; }
          done
      - name: Test versione normale
        run: npm test
      - name: Test versione di prova
        run: if [ -d prova ]; then APP_DIR=prova npm test; fi
