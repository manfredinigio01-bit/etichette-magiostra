<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Etichette La Magiostra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5f7a50">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style id="pagestyle">@page { size: 210mm 297mm; margin: 0; }</style>
<style>
:root{--verde:#5f7a50;--verde-sc:#46603a;--bg:#f5f4ef;--card:#fff;--bordo:#dcd9cf;--testo:#24261f;--muted:#6d7064;--rosso:#b3261e;--giallo:#fff4d6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--testo);font-size:14px}
header.app{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bordo);position:sticky;top:0;z-index:5}
header.app img{height:34px}
header.app h1{font-size:16px;margin:0;font-weight:600;color:var(--verde-sc)}
nav{display:flex;gap:4px;margin-left:12px}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--verde);color:#fff}
#syncStatus{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
#syncStatus.err{color:var(--rosso)}
main{padding:20px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bordo);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--verde-sc)}
.card h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:minmax(380px,1fr) minmax(380px,1fr);gap:16px;align-items:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:120px}
label.f.s{flex:0 0 110px;min-width:90px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--bordo);border-radius:7px;background:#fff;color:var(--testo)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid #9bb38c;border-color:#9bb38c}
.b{display:inline-block;font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bordo);background:#fff;cursor:pointer}
.b:hover{background:#f0efe8}
button.p{background:var(--verde);border-color:var(--verde);color:#fff}
button.p:hover{background:var(--verde-sc)}
button.d{color:var(--rosso)}
button.sm{padding:4px 9px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--testo)}
.muted{color:var(--muted);font-size:12px}
.warn{background:var(--giallo);border:1px solid #ecd28a;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.err{background:#fdecea;border:1px solid #f1b0aa;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0;color:#7a1712}
.plist{max-height:420px;overflow:auto;border:1px solid var(--bordo);border-radius:8px}
.plist div.it{padding:7px 10px;border-bottom:1px solid #eeece5;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.plist div.it:hover{background:#f3f6f0}
.plist div.it.on{background:#e3ecdc}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:10px;background:#eef0e8;color:#4c5245;margin:1px}
.tag.a{background:#fbe5cf;color:#7a4510}
table.q{width:100%;border-collapse:collapse;font-size:13px}
table.q td,table.q th{padding:6px;border-bottom:1px solid #eeece5;text-align:left}
.prevwrap{overflow:auto;display:flex;justify-content:safe center;padding:16px;background:repeating-conic-gradient(#ecebe4 0 25%,#f7f6f1 0 50%) 0 0/16px 16px;border-radius:10px}
.sheetmap{display:inline-grid;gap:3px;padding:6px;background:#eceae2;border-radius:6px}
.sheetmap div{width:26px;height:30px;background:#fff;border:1px solid #cfccc0;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px}
.sheetmap div.skip{background:#d6d3c8;color:#999}
.sheetmap div.start{outline:2px solid var(--verde);font-weight:700}
.flexsp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hidden{display:none!important}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#e3ecdc;color:var(--verde-sc)}

/* ===== ETICHETTA (unità reali mm/pt) ===== */
.lbl{position:relative;overflow:hidden;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;line-height:1.18}
.lbl.cut{outline:0.1mm dashed #999}
.lbl .in{position:absolute;inset:0;display:flex;flex-direction:column}
.lbl .hd{display:flex;align-items:center;gap:1.6mm}
.lbl .hd img.sole{flex:0 0 auto}
.lbl .hd .hr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.lbl .hd img.scritta{max-width:100%;display:block}
.lbl .azsub{font-family:Georgia,"Times New Roman",serif;letter-spacing:.18em;font-size:8pt;margin-top:.6mm;line-height:1}
.lbl .aznome{font-family:Georgia,serif;font-size:13pt;font-style:italic}
.lbl .rs{text-align:center;font-weight:700;margin-top:.6mm;white-space:nowrap}
.lbl .addr{text-align:center;white-space:nowrap}
.lbl .cont{text-align:center}
.lbl .pn{font-weight:700;text-align:center;margin-top:1.1mm;font-size:11pt;line-height:1.05;text-transform:uppercase}
.lbl .ps{text-align:center;font-size:8pt;margin-top:.2mm}
.lbl .body{flex:1;min-height:0;overflow:hidden;margin-top:1.2mm}
.lbl .fit p{margin:0 0 .7mm 0;text-align:left}
.lbl .fit b.al{font-weight:900}
.lbl .fit .cons{font-weight:700}
.lbl .ft{border-top:0.25mm solid #000;padding-top:.8mm;margin-top:.6mm}
.lbl .hc{flex:1;min-width:0;line-height:1.15}
.lbl .hc .rsc{font-weight:700}
.lbl .ft.fc .big{font-weight:700;font-size:8.5pt;white-space:nowrap}
.lbl .ft.fc .r2{display:flex;justify-content:space-between;gap:1mm;align-items:baseline}
.lbl .ft .sc .big{font-weight:700;font-size:8.5pt;white-space:nowrap}
.lbl .ft .ftr{display:flex;gap:1.5mm;align-items:flex-end;margin-top:.5mm}
.lbl .ft .dl{flex:1;min-width:0}
.lbl .ft .box{flex:0 0 auto;border:0.35mm solid #000;border-radius:1.2mm;padding:.4mm 1.2mm;text-align:right}
.lbl .ft .box .k{font-size:6pt}
.lbl .ft .box .v{font-weight:700;font-size:9.5pt;white-space:nowrap}
.lbl .ft .box .pr{border-top:0.2mm solid #000;margin-top:.3mm;padding-top:.2mm}
.lbl.toosmall::after{content:"⚠ testo sotto il minimo";position:absolute;right:0;top:0;background:#b3261e;color:#fff;font-size:6pt;padding:.3mm 1mm}
.lbl.overflow::after{content:"⚠ NON ENTRA A NORMA";position:absolute;right:0;top:0;background:#b3261e;color:#fff;font-size:7pt;padding:.4mm 1mm}

/* ===== AREA DI STAMPA ===== */
#print{position:absolute;left:-30000px;top:0}
.sheet{position:relative;overflow:hidden;background:#fff;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.sheet .slot{position:absolute}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{position:static;left:auto}
  .lbl.toosmall::after,.lbl.overflow::after{display:none}
  .calib-note{display:block}
}
</style>
</head>
<body>
<header class="app">
  <img id="hdrLogo" alt="">
  <h1>Etichette</h1>
  <nav>
    <button data-tab="stampa" class="on">Stampa</button>
    <button data-tab="prodotti">Prodotti</button>
    <button data-tab="impostazioni">Impostazioni</button>
  </nav>
  <div id="syncStatus">Archivio: solo su questo computer</div>
  <div id="ver" class="muted" style="font-size:11px;margin-left:10px"></div>
</header>
<div id="reconnect" class="hidden" style="background:#fff4d6;padding:8px 20px;border-bottom:1px solid #ecd28a;font-size:13px">

</div>
<div id="updbar" class="hidden" style="background:#e3ecdc;padding:8px 20px;border-bottom:1px solid #b9cdaa;font-size:13px">
  È disponibile una nuova versione dell'app. <button class="b sm p" onclick="location.reload()">Aggiorna ora</button>
</div>

const W2A = {}; ALLERGENI.forEach(a=>a.w.forEach(w=>W2A[w]=a.k));
const ALL_WORDS = Object.keys(W2A).sort((a,b)=>b.length-a.length);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RE_ALL = new RegExp('(?<!\\p{L})(' + ALL_WORDS.map(reEsc).join('|') + ')(?!\\p{L})','giu');
const RE_EXC = new RegExp('(?<!\\p{L})(' + ESCLUSIONI.map(reEsc).join('|') + ')(?!\\p{L})','giu');

function highlight(text, upper){
  // *parola* = grassetto forzato
  const found = new Set(); let html='';
  const parts = String(text||'').split(/\*([^*]+)\*/);
  parts.forEach((seg,i)=>{
    if(i%2===1){ html += `<b class="al">${esc(upper?seg.toUpperCase():seg)}</b>`; const k=W2A[seg.toLowerCase()]; if(k)found.add(k); else found.add('manuale:'+seg); return; }
    const prot=[]; let m; RE_EXC.lastIndex=0;
    while((m=RE_EXC.exec(seg))){ const fw=m[1].split(' ')[0]; prot.push([m.index,m.index+fw.length]); }
    let last=0; RE_ALL.lastIndex=0;
    while((m=RE_ALL.exec(seg))){
      const s=m.index, e=s+m[1].length;
      if(prot.some(([a,b])=>s<b&&e>a)){ continue; }
      html += esc(seg.slice(last,s)) + `<b class="al">${esc(upper?m[1].toUpperCase():m[1])}</b>`; last=e;
      found.add(W2A[m[1].toLowerCase()]);
    }
    html += esc(seg.slice(last));
  });
  return {html, found:[...found]};
}

const MIN_LEGALE=7; // pt: x-height ≈ 1,28 mm in Arial (Reg. UE 1169/2011 art. 13: ≥ 1,2 mm)
function fitLabels(root){
  const e=S.settings.etichetta;
  root.querySelectorAll('.lbl').forEach(l=>{
    const body=l.querySelector('.body'), fit=l.querySelector('.fit'); if(!body||!fit) return;
    let size=e.maxPt; fit.style.fontSize=size+'pt';
    const minPt=Math.max(MIN_LEGALE,e.minPt);
    while(fit.offsetHeight>body.clientHeight+0.5 && size>minPt){ size-=0.25; fit.style.fontSize=size+'pt'; }
    l.classList.toggle('overflow', fit.offsetHeight>body.clientHeight+0.5);
    l.dataset.pt=size;
  });
}

/* ================== STAMPA ================== */
function slotPos(i){
  const f=S.settings.foglio, e=S.settings.etichetta;
  const per=f.cols*f.rows, idx=i%per, r=Math.floor(idx/f.cols), c=idx%f.cols;
  return {x:f.mLeft + c*(e.w+f.gapX) + DEV.offX, y:f.mTop + r*(e.h+f.gapY) + DEV.offY};
}
function buildSheets(labels, start){
  const f=S.settings.foglio, e=S.settings.etichetta;
  if(f.modo==='singola'){
    setPage(e.w,e.h);
    return labels.map(h=>`<div class="sheet" style="width:${e.w}mm;height:${e.h}mm"><div class="slot" style="left:${DEV.offX}mm;top:${DEV.offY}mm">${h}</div></div>`).join('');
  }
  setPage(f.pageW,f.pageH);
  const per=f.cols*f.rows; let out='', cur='', n=start||0;
  const all=[...labels];
  while(all.length){
    const h=all.shift();
    const p=slotPos(n);
    cur+=`<div class="slot" style="left:${p.x}mm;top:${p.y}mm">${h}</div>`;
    n++;
    if(n%per===0 || !all.length){ out+=`<div class="sheet" style="width:${f.pageW}mm;height:${f.pageH}mm">${cur}</div>`; cur=''; }
  }
  return out;
}
function setPage(w,h){ document.getElementById('pagestyle').textContent=`@page { size: ${w}mm ${h}mm; margin: 0; }`; }
function expandQueue(){
  const out=[]; DEV.coda.forEach(j=>{ if(!getP(j.pid)||getP(j.pid).deleted) return; for(let i=0;i<(j.qty||1);i++) out.push(j); }); return out;
}
function doPrint(jobs, start){
  const f=S.settings.foglio;
  const cut = f.taglio;
  const labels = jobs.map(j=>labelHTML(j,{cut}));
  const pr=document.getElementById('print');
  pr.innerHTML = buildSheets(labels, f.modo==='singola'?0:start);
  fitLabels(pr);
  const bad = pr.querySelectorAll('.lbl.overflow').length;
  if(bad){ pr.innerHTML=''; alert(`Stampa bloccata: ${bad} etichett${bad>1?'e non rispettano':'a non rispetta'} il carattere minimo di legge (7 pt) perché il testo non entra.\n\nScegli un formato più grande in Impostazioni → Foglio di stampa, oppure accorcia il testo del prodotto.`); return; }
  if(f.modo==='a4'){ const per=f.cols*f.rows; DEV.start=((start||0)+jobs.length)%per; saveDev(); }
  setTimeout(()=>{window.print(); render();},50);
}
function printCalibration(){
  const f=S.settings.foglio, e=S.settings.etichetta;
  setPage(f.pageW,f.pageH);
  let slots='';
  for(let i=0;i<f.cols*f.rows;i++){ const p=slotPos(i); slots+=`<div class="slot" style="left:${p.x}mm;top:${p.y}mm;width:${e.w}mm;height:${e.h}mm;border:0.2mm solid #000;display:flex;align-items:center;justify-content:center;font:9pt Arial">${i+1}</div>`; }
  const cross=(x,y)=>`<div style="position:absolute;left:${x-5+DEV.offX}mm;top:${y+DEV.offY}mm;width:10mm;border-top:0.2mm solid #000"></div><div style="position:absolute;left:${x+DEV.offX}mm;top:${y-5+DEV.offY}mm;height:10mm;border-left:0.2mm solid #000"></div>`;
  const html=`<div class="sheet" style="width:${f.pageW}mm;height:${f.pageH}mm">${slots}
   ${cross(20,20)}
   <div style="position:absolute;left:${30+DEV.offX}mm;top:${148+DEV.offY}mm;width:100mm;border-top:0.4mm solid #000"></div>
   <div style="position:absolute;left:${30+DEV.offX}mm;top:${150+DEV.offY}mm;font:8pt Arial;background:#fff">Questa linea deve misurare esattamente 100 mm. Se è diversa la stampa è in scala: impostare Scala 100%.</div>
   <div style="position:absolute;left:${26+DEV.offX}mm;top:${17+DEV.offY}mm;font:8pt Arial;background:#fff;padding:0 1mm">← il centro della croce deve stare a 20 mm dal bordo sinistro e 20 mm dal bordo alto</div>
  </div>`;
  const pr=document.getElementById('print'); pr.innerHTML=html; setTimeout(()=>window.print(),50);
}

function ed(k,v,re){ EDIT[k]=v; if(re) render(); else refreshEditorPreview(); }
function editorHTML(p){
  const hl=highlight(p.ingredienti);
  const al=hl.found.filter(k=>!k.startsWith('manuale')).map(k=>ALLERGENI.find(a=>a.k===k).n);
  const man=hl.found.filter(k=>k.startsWith('manuale')).map(k=>k.slice(8));
  const cons=getCons(p.conservazione);
  const bio=/(?<!\p{L})bio(logic[oaie])?(?!\p{L})/iu.test(p.nome+' '+p.sottotitolo+' '+p.ingredienti);
  const job={pid:'__edit',kg:(getPz(p.pezzature?.[0])||S.settings.pezzature[0]||{}).kg??null,prod:isoToday(),scad:addDays(isoToday(),p.giorni||0),lotto:lotto(isoToday()),prezzo:'',showPrice:false};
  return `<div class="card"><div class="flexsp"><h2>${p._new?'Nuovo prodotto':'Modifica prodotto'}</h2>
    <div><button class="b p" onclick="saveProduct()">Salva</button> ${!p._new?`<button class="b" onclick="dupProduct()">Duplica</button> <button class="b d" onclick="delProduct()">Elimina</button>`:''} <button class="b" onclick="EDIT=null;render()">Chiudi</button></div></div>
    <div class="row"><label class="f">Nome (in grande)<input value="${esc(p.nome)}" oninput="ed('nome',this.value)"></label></div>
    <div class="row"><label class="f">Sottotitolo<input value="${esc(p.sottotitolo)}" placeholder="es. con ragù di cavolfiore" oninput="ed('sottotitolo',this.value)"></label></div>
    <div class="row"><label class="f">Ingredienti (in ordine di peso decrescente)<textarea oninput="ed('ingredienti',this.value);document.getElementById('alfound').innerHTML=alFoundHTML(this.value)">${esc(p.ingredienti)}</textarea></label></div>
    <div id="alfound">${alFoundHTML(p.ingredienti)}</div>
    ${bio?`<div class="warn">Hai scritto "bio/biologico". Senza certificazione biologica di La Magiostra questo termine probabilmente non può comparire in etichetta: verifica con il tuo consulente HACCP/ente certificatore.</div>`:''}
    <h3>Tracce di allergeni (contaminazione crociata)</h3>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px">${ALLERGENI.map(a=>`<label class="chk"><input type="checkbox" ${p.tracce?.includes(a.k)?'checked':''} onchange="toggleTraccia('${a.k}',this.checked)"> ${a.n}</label>`).join('')}</div>
    <div class="row" style="margin-top:8px"><label class="f">Testo aggiuntivo tracce (facoltativo)<input value="${esc(p.tracceExtra)}" oninput="ed('tracceExtra',this.value)"></label></div>
    <h3>Conservazione e data</h3>
    <div class="row">
      <label class="f">Dicitura di conservazione<select onchange="setCons(this.value)">${S.settings.conservazioni.map(c=>`<option value="${c.id}" ${p.conservazione===c.id?'selected':''}>${esc(c.testo)}</option>`).join('')}<option value="" ${!p.conservazione?'selected':''}>— nessuna —</option></select></label>
    </div>
    <div class="row">
      <label class="f">Tipo di data<select onchange="ed('tipoData',this.value,true)"><option value="scadenza" ${p.tipoData!=='tmc'?'selected':''}>Da consumarsi entro (scadenza)</option><option value="tmc" ${p.tipoData==='tmc'?'selected':''}>Da consumarsi preferibilmente entro (TMC)</option></select></label>
      <label class="f s">Giorni di durata<input type="number" min="0" value="${p.giorni}" oninput="ed('giorni',parseInt(this.value)||0)"></label>
    </div>
    ${cons&&/frigorifero/i.test(cons.testo)&&p.tipoData==='tmc'?`<div class="warn">Prodotto refrigerato deperibile: di norma serve "Da consumarsi entro", non "preferibilmente".</div>`:''}
    <div class="row"><label class="f">Altre diciture (facoltativo)<input value="${esc(p.diciture)}" placeholder="es. Scaldare prima del consumo" oninput="ed('diciture',this.value)"></label></div>
    <h3>Vendita</h3>
    <div class="row">
      <label class="f s">Prezzo €/kg<input value="${esc(p.prezzoKg)}" placeholder="18,00" oninput="ed('prezzoKg',this.value)"></label>
      <label class="chk"><input type="checkbox" ${p.mostraPrezzo?'checked':''} onchange="ed('mostraPrezzo',this.checked)"> Prezzo attivo di default in stampa</label>
    </div>
    <div class="muted" style="margin-bottom:4px">Pezzature disponibili per questo prodotto (nessuna selezionata = tutte):</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px">${S.settings.pezzature.map(z=>`<label class="chk"><input type="checkbox" ${p.pezzature?.includes(z.id)?'checked':''} onchange="togglePz('${z.id}',this.checked)"> ${esc(z.nome)}</label>`).join('')}</div>
  </div>

function alFoundHTML(text){
  const hl=highlight(text);
  const al=hl.found.filter(k=>!k.startsWith('manuale')).map(k=>ALLERGENI.find(a=>a.k===k).n);
  const man=hl.found.filter(k=>k.startsWith('manuale')).map(k=>k.slice(8));
  return `<div class="muted">Allergeni rilevati: ${al.length?al.map(n=>`<span class="tag a">${n}</span>`).join(''):'<i>nessuno</i>'} ${man.length?' · grassetto manuale: '+man.map(m=>`<span class="tag">${esc(m)}</span>`).join(''):''}</div>`;
}
function scaledEditPreview(job){
  const real=getP('__edit'); // placeholder non usato
  const keep=S.prodotti; S.prodotti=[...keep,{...EDIT,id:'__edit'}];
  const h=scaled(labelHTML(job),2.2); S.prodotti=keep; return h;
}
let prevT=null;
function refreshEditorPreview(){ clearTimeout(prevT); prevT=setTimeout(()=>{ const el=document.getElementById('edprev'); if(!el) return; const p=EDIT; const job={pid:'__edit',kg:(getPz(p.pezzature?.[0])||S.settings.pezzature[0]||{}).kg??null,prod:isoToday(),scad:addDays(isoToday(),p.giorni||0),lotto:lotto(isoToday()),prezzo:'',showPrice:false}; el.innerHTML=scaledEditPreview(job); fitLabels(el); },150); }
function toggleTraccia(k,on){ EDIT.tracce=(EDIT.tracce||[]).filter(x=>x!==k); if(on) EDIT.tracce.push(k); refreshEditorPreview(); }
function togglePz(k,on){ EDIT.pezzature=(EDIT.pezzature||[]).filter(x=>x!==k); if(on) EDIT.pezzature.push(k); }
function setCons(id){ EDIT.conservazione=id; const c=getCons(id); if(c) EDIT.tipoData=c.tipoData; render(); }
function saveProduct(){
  if(!EDIT.nome.trim()){ alert('Inserisci il nome del prodotto'); return; }
  const p={...EDIT}; delete p._new; p.updatedAt=now();
  const i=S.prodotti.findIndex(x=>x.id===p.id); if(i>=0) S.prodotti[i]=p; else S.prodotti.push(p);
  EDIT=JSON.parse(JSON.stringify(p)); commit(); render();
}
function dupProduct(){ EDIT={...JSON.parse(JSON.stringify(EDIT)),id:uid(),nome:EDIT.nome+' (copia)',_new:true}; render(); }
function delProduct(){ if(!confirm('Eliminare "'+EDIT.nome+'"?')) return; const p=getP(EDIT.id); if(p){p.deleted=true;p.updatedAt=now();} EDIT=null; commit(); render(); }

function applyPreset(k){ const p=PRESETS[k]; const f=S.settings.foglio; f.preset=k; if(k!=='custom'){ Object.assign(f,{cols:p.cols,rows:p.rows,mTop:p.mTop,mLeft:p.mLeft,gapX:p.gapX,gapY:p.gapY,taglio:p.taglio}); S.settings.etichetta.w=p.w; S.settings.etichetta.h=p.h; } touchSettings(); render(); }
function centerSheet(){ const f=S.settings.foglio,e=S.settings.etichetta; f.mLeft=+((f.pageW-(f.cols*e.w+(f.cols-1)*f.gapX))/2).toFixed(2); f.mTop=+((f.pageH-(f.rows*e.h+(f.rows-1)*f.gapY))/2).toFixed(2); f.preset='custom'; touchSettings(); render(); }
function loadLogo(inp){ const fr=new FileReader(); fr.onload=()=>{ S.settings.logoCustom=fr.result; touchSettings(); render(); }; fr.readAsDataURL(inp.files[0]); }
function exportJSON(){ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='etichette-magiostra-backup-'+isoToday()+'.json'; a.click(); }
function importJSON(inp){ inp.files[0].text().then(t=>{ try{ const d=JSON.parse(t); if(!d.settings||!d.prodotti) throw 0; if(!confirm('Unire il backup con i dati attuali? (vince la versione più recente di ogni prodotto)')) return; S=merge(S,d); commit(); render(); alert('Importato.'); }catch(e){ alert('File non valido'); } }); }
function importCSV(text){
  text=String(text||'').replace(/^﻿/,'').trim(); if(!text) return;
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const sep = lines[0].includes('\t')?'\t':(lines[0].split(';').length>=lines[0].split(',').length?';':',');
  const parse = l => { const out=[]; let cur='',q=false; for(let i=0;i<l.length;i++){const c=l[i]; if(q){ if(c==='"'&&l[i+1]==='"'){cur+='"';i++;} else if(c==='"') q=false; else cur+=c; } else if(c==='"') q=true; else if(c===sep){out.push(cur);cur='';} else cur+=c;} out.push(cur); return out.map(s=>s.trim()); };
  const hdr=parse(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z_]/g,''));
  const ix = n => hdr.findIndex(h=>h.startsWith(n));
  const iN=ix('nome'); if(iN<0){ alert('Manca la colonna "nome" nella prima riga'); return; }
  const iS=ix('sottotitolo'), iI=ix('ingredienti'), iG=ix('giorni'), iP=ix('prezzo'), iC=ix('conservazione');
  let n=0, upd=0; const t=now();
  lines.slice(1).forEach(l=>{ const c=parse(l); const nome=c[iN]; if(!nome) return;
    const consTxt=(iC>=0?c[iC]:'').toLowerCase();
    const cons = /cong|surg|-18/.test(consTxt)?'cs3':/secc|fresco e asciutto|dispensa/.test(consTxt)?'cs2':'cs1';
    const csObj=getCons(cons)||S.settings.conservazioni[0];
    const ex=prodotti().find(p=>p.nome.toLowerCase()===nome.toLowerCase() && (iS<0||(p.sottotitolo||'').toLowerCase()===(c[iS]||'').toLowerCase()));
    const data={nome,sottotitolo:iS>=0?c[iS]:'',ingredienti:iI>=0?c[iI]:'',giorni:iG>=0?(parseInt(c[iG])||0):3,prezzoKg:iP>=0?c[iP]:'',conservazione:csObj?.id,tipoData:csObj?.tipoData||'scadenza',updatedAt:t};
    if(ex){ Object.assign(ex,data); upd++; } else { S.prodotti.push({id:uid(),tracce:[],tracceExtra:'',diciture:'',pezzature:[],mostraPrezzo:false,...data}); n++; }
  });
  commit(); render(); alert(`Importati ${n} nuovi prodotti, aggiornati ${upd}.`);
}

/* ================== ARCHIVIO CONDIVISO ================== */
function merge(a,b){
  const out={version:1,settings:(b.settings?.updatedAt||0)>(a.settings?.updatedAt||0)?b.settings:a.settings,prodotti:[]};
  const m=new Map(); [...(a.prodotti||[]),...(b.prodotti||[])].forEach(p=>{ const o=m.get(p.id); if(!o||(p.updatedAt||0)>(o.updatedAt||0)) m.set(p.id,p); });
  out.prodotti=[...m.values()]; return normalize(out);
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('mag_etichette',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=rej; }); }
async function kvSet(k,v){ const d=await idb(); return new Promise(r=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=r; }); }
async function kvGet(k){ const d=await idb(); return new Promise(r=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }
async function connectFile(create){
  try{
    const opts={types:[{description:'Archivio etichette',accept:{'application/json':['.json']}}]};
    fileHandle = create ? await showSaveFilePicker({...opts,suggestedName:'archivio-etichette-magiostra.json'}) : (await showOpenFilePicker(opts))[0];
    await kvSet('handle',fileHandle);
    if(create){ const w=await fileHandle.createWritable(); await w.write(JSON.stringify(S)); await w.close(); }
    await syncNow(true); render();
  }catch(e){ if(e.name!=='AbortError') alert('Impossibile collegare il file: '+e.message); }
}
async function disconnectFile(){ fileHandle=null; await kvSet('handle',null); setStatus('Archivio: solo su questo computer'); render(); }
async function reconnectFile(){ if(!fileHandle) return; const p=await fileHandle.requestPermission({mode:'readwrite'}); if(p==='granted'){ document.getElementById('reconnect').classList.add('hidden'); await syncNow(true); } }
function setStatus(t,err){ const s=document.getElementById('syncStatus'); s.textContent=t; s.classList.toggle('err',!!err); }
let syncing=false;
async function syncNow(force){
  if(!fileHandle||syncing) return; syncing=true;
  try{
    const perm=await fileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){ document.getElementById('reconnect').classList.remove('hidden'); setStatus('Archivio condiviso: da ricollegare',true); return; }
    const file=await fileHandle.getFile(); const txt=await file.text();
    let remote=null; try{ remote=txt.trim()?JSON.parse(txt):null; }catch(e){ setStatus('Archivio illeggibile (forse in sincronizzazione), riprovo…',true); return; }
    const before=JSON.stringify(S);
    const merged = remote ? merge(S,remote) : S;
    const mStr=JSON.stringify(merged);
    if(!remote || mStr!==JSON.stringify(remote)){ const w=await fileHandle.createWritable(); await w.write(mStr); await w.close(); }
    if(mStr!==before){ S=merged; saveLocal(); if(!EDIT) render(); }
    lastSync=new Date(); setStatus('Archivio condiviso: '+fileHandle.name+' · aggiornato '+lastSync.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setStatus('Errore archivio: '+e.message,true); }
  finally{ syncing=false; }
}
(async()=>{
  if('showOpenFilePicker' in window){ try{ const h=await kvGet('handle'); if(h){ fileHandle=h; await syncNow(); } }catch(e){} }
  setInterval(()=>syncNow(),20000);
  window.addEventListener('focus',()=>syncNow());
})();
window.addEventListener('afterprint',()=>{ document.getElementById('print').innerHTML=''; });

/* ================== VERSIONE E AGGIORNAMENTI ================== */
const APP_VERSION='0.2.3';
document.getElementById('ver').textContent='v'+APP_VERSION;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js');
  const checkUpd=()=>fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{ if(v.version!==APP_VERSION) document.getElementById('updbar').classList.remove('hidden'); }).catch(()=>{});
  checkUpd(); setInterval(checkUpd,10*60*1000); window.addEventListener('focus',checkUpd);
}

render();
</script>
